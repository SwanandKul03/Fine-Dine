er;justify-content:center">?</span></span>

<script>let flowHeightFrame=0;const reportFlowHeight=()=>{if(flowHeightFrame)return;flowHeightFrame=requestAnimationFrame(()=>{flowHeightFrame=0;window.parent.postMessage({type:'oblix:flow-height',height:Math.ceil(document.querySelector('.service-flow-layout')?.getBoundingClientRect().height||document.body.scrollHeight)},location.origin);});};const flowResize=new ResizeObserver(reportFlowHeight);flowResize.observe(document.body);let observedFlow=null;new MutationObserver(()=>{const layout=document.querySelector('.service-flow-layout');if(layout&&layout!==observedFlow){observedFlow=layout;flowResize.observe(layout);}reportFlowHeight();}).observe(document.body,{childList:true,subtree:true});addEventListener('load',reportFlowHeight);addEventListener('message',e=>{if(e.origin===location.origin&&e.source===window.parent&&e.data?.type==='oblix:flow-visibility')document.documentElement.classList.toggle('flow-paused',!e.data.visible);});</script></body>
